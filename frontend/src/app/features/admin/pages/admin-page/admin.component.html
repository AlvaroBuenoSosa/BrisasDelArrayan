<section class="admin-container">

  <div class="admin-card">

    <h1>Panel de Administración</h1>

    <!-- ACCIÓN -->
    <div class="form-group">
      <label>Acción</label>

      <select [(ngModel)]="accion" name="accion">
        <option value="crear">Crear</option>
        <option value="editar">Modificar</option>
        <option value="eliminar">Eliminar</option>
      </select>
    </div>

    <!-- TIPO -->
    <div class="form-group">
      <label>Tipo de recurso</label>

      <select
        [(ngModel)]="resourceType"
        name="resourceType"
        (change)="resetForm()">

        <option value="ejemplares">Ejemplares</option>
        <option value="ejemplarespedigree">Pedigree</option>
        <option value="cachorros">Cachorros</option>
        <option value="camadas">Camadas</option>

      </select>
    </div>

    <!-- BUSCADOR -->
    <ng-container *ngIf="accion !== 'crear'">

      <div class="form-group">
        <label>Buscar por nombre</label>

        <input
          type="text"
          [(ngModel)]="nombreBusqueda"
          (input)="filtrarResultados()">
      </div>

      <div class="form-group">
        <label>Resultados de búsqueda</label>

        <select
          [(ngModel)]="idSeleccionado"
          (change)="seleccionarResultado()">

          <option *ngFor="let item of resultadosBusqueda" [value]="item.id">
            {{ item.name || item.nombre }}
          </option>

        </select>
      </div>

    </ng-container>

    <hr>

    <!-- FORM -->
    <form
      *ngIf="accion === 'crear' || accion === 'editar'"
      (ngSubmit)="onSubmit()">

      <!-- ================= EJEMPLARES ================= -->
      <ng-container
        *ngIf="resourceType === 'ejemplares' || resourceType === 'ejemplarespedigree'">

        <div class="form-group">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="nuevoRecurso.name" name="name">
        </div>

        <div class="form-group">
          <label>Títulos</label>
          <input type="text" [(ngModel)]="nuevoRecurso.titles" name="titles">
        </div>

        <div class="form-group">
          <label>Raza</label>

          <select [(ngModel)]="nuevoRecurso.breed" name="breed">
            <option>Teckel Miniatura De Pelo Corto</option>
            <option>Teckel Kaninchen De Pelo Corto</option>
          </select>

        </div>

        <div class="form-group">
          <label>Color</label>

          <select [(ngModel)]="nuevoRecurso.color" name="color">
            <option>Negro Y Fuego</option>
            <option>Chocolate Y Fuego</option>
            <option>Arlequin Chocolate</option>
            <option>Arlequin Negro</option>
            <option>Rojo</option>
          </select>

        </div>

        <div class="form-group">
          <label>Sexo</label>

          <select [(ngModel)]="nuevoRecurso.sexo" name="sexo">
            <option>Macho</option>
            <option>Hembra</option>
          </select>

        </div>

        <div class="form-group">
          <label>Fotos</label>

          <input
            type="file"
            multiple
            accept="image/*"
            (change)="onMultipleFilesSelected($event)">
        </div>

      </ng-container>

      <!-- ================= CACHORROS ================= -->
      <ng-container *ngIf="resourceType === 'cachorros'">

        <div class="form-group">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="nuevoRecurso.nombre" name="nombre">
        </div>

        <div class="form-group">
          <label>Raza</label>
          <input type="text" [(ngModel)]="nuevoRecurso.raza" name="raza">
        </div>

        <div class="form-group">
          <label>Color</label>
          <input type="text" [(ngModel)]="nuevoRecurso.color" name="colorCachorro">
        </div>

        <div class="form-group">
          <label>Sexo</label>

          <select [(ngModel)]="nuevoRecurso.sexo" name="sexoCachorro">
            <option>Macho</option>
            <option>Hembra</option>
          </select>

        </div>

        <div class="form-group">
          <label>Fecha nacimiento</label>

          <input
            type="date"
            [(ngModel)]="nuevoRecurso.fechaNacimiento"
            name="fechaNacimiento">
        </div>

        <div class="form-group">
          <label>Fotos</label>

          <input
            type="file"
            multiple
            accept="image/*"
            (change)="onMultipleFilesSelected($event)">
        </div>

      </ng-container>

      <!-- ================= CAMADAS ================= -->
      <ng-container *ngIf="resourceType === 'camadas'">

        <div class="form-group">
          <label>Nombre camada</label>

          <input
            type="text"
            [(ngModel)]="nuevoRecurso.nombre"
            name="camadaNombre">
        </div>

        <div class="form-group">
          <label>Fecha nacimiento</label>

          <input
            type="date"
            [(ngModel)]="nuevoRecurso.fechaNacimiento"
            name="fechaNacimientoCamada">
        </div>

      </ng-container>

      <!-- ================= PADRES ================= -->
      <div class="form-group">
        <label>Padre</label>

        <select [(ngModel)]="nuevoRecurso.padreNombre" name="padreNombre">
          <option *ngFor="let nombre of nombresEjemplares" [value]="nombre">
            {{ nombre }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Madre</label>

        <select [(ngModel)]="nuevoRecurso.madreNombre" name="madreNombre">
          <option *ngFor="let nombre of nombresEjemplares" [value]="nombre">
            {{ nombre }}
          </option>
        </select>
      </div>

      <!-- ================= PREVIEW ================= -->
      <div class="preview-grid" *ngIf="imagePreviews.length">
        <img *ngFor="let image of imagePreviews" [src]="image">
      </div>

      <button class="submit-btn" type="submit">
        {{ accion === 'crear' ? 'Crear' : 'Guardar cambios' }}
      </button>

    </form>

    <!-- ================= ELIMINAR ================= -->
    <div *ngIf="accion === 'eliminar' && recursoSeleccionado">

      <h3>
        {{ recursoSeleccionado?.name || recursoSeleccionado?.nombre }}
      </h3>

      <button class="delete-btn" (click)="eliminarActual()">
        Eliminar
      </button>

    </div>

  </div>

</section>
