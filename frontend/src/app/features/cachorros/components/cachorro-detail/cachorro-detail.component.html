<section class="detail-container">

  <div class="info">

    <h1>{{ cachorro.nombre }}</h1>

    <p><strong>Raza:</strong> {{ cachorro.raza }}</p>

    <p><strong>Color:</strong> {{ cachorro.color }}</p>

    <p><strong>Sexo:</strong> {{ cachorro.sexo }}</p>

    <p><strong>Nacimiento:</strong> {{ cachorro.fechaNacimiento }}</p>

  </div>

  <div
    id="cachorroCarousel"
    class="carousel slide"
    data-bs-ride="carousel">

    <div class="carousel-inner">

      <div
        *ngFor="let photo of getPhotos(); let i = index"
        class="carousel-item"
        [class.active]="i === 0">

        <img
          [src]="photo"
          class="carousel-image"
          [alt]="cachorro.nombre">

      </div>

    </div>

    <button
      *ngIf="getPhotos().length > 1"
      class="carousel-control-prev"
      type="button"
      data-bs-target="#cachorroCarousel"
      data-bs-slide="prev">

      <span class="carousel-control-prev-icon"></span>

    </button>

    <button
      *ngIf="getPhotos().length > 1"
      class="carousel-control-next"
      type="button"
      data-bs-target="#cachorroCarousel"
      data-bs-slide="next">

      <span class="carousel-control-next-icon"></span>

    </button>

  </div>

</section>

<app-pedigree
  [ejemplarId]="cachorro.id">
</app-pedigree>
