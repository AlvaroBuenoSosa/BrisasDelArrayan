<h2 class="title">
  Iniciar Sesión
</h2>

<form
  class="login-form"
  (ngSubmit)="login()"
  #loginForm="ngForm"
>

  <mat-form-field appearance="outline">

    <mat-label>Usuario</mat-label>

    <input
      matInput
      name="username"
      [(ngModel)]="username"
      required
    >

  </mat-form-field>

  <mat-form-field appearance="outline">

    <mat-label>Contraseña</mat-label>

    <input
      matInput
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    >

  </mat-form-field>

  <p
    *ngIf="errorMessage"
    class="error"
  >
    {{ errorMessage }}
  </p>

  <div class="actions">

    <button
      mat-button
      type="button"
      (click)="close()"
    >
      Cancelar
    </button>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="loginForm.invalid"
    >
      Entrar
    </button>

  </div>

</form>
